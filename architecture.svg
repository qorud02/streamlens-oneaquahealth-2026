<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
<title id="title">StreamLens architecture</title><desc id="desc">Guided capture, validation, local workspace, explainable rules, human review and portable exports. Service worker caches the app shell.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#297d6d"/></marker></defs>
<rect width="1200" height="670" fill="#f5f6ef"/>
<g font-family="Arial,sans-serif" fill="#183f37"><text x="58" y="62" font-size="14" letter-spacing="3" fill="#447c6c">LOCAL EVIDENCE · HUMAN JUDGMENT</text><text x="58" y="111" font-size="37" font-weight="bold">One observation, a traceable next action.</text><text x="58" y="145" font-size="17" fill="#67786d">StreamLens · browser-only architecture · no paid runtime or account</text></g>
<g stroke="#297d6d" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M268 278H310"/><path d="M505 278H550"/><path d="M745 278H790"/><path d="M995 278H1040"/><path d="M648 339V403H400V343"/><path d="M888 339V472H648V345"/><path d="M648 217V190H162V219"/></g>
<g font-family="Arial,sans-serif">
<rect x="58" y="219" width="210" height="120" rx="15" fill="#173f36"/><text x="78" y="252" fill="#a9d7bc" font-size="12" letter-spacing="1">01 · CITIZEN CAPTURE</text><text x="78" y="280" fill="#fff" font-size="19" font-weight="bold">Describe the visit</text><text x="78" y="306" fill="#d2e2d7" font-size="13">Site · time · context · evidence</text>
<rect x="310" y="219" width="195" height="120" rx="15" fill="#fff" stroke="#d2dfd5"/><text x="330" y="252" fill="#397762" font-size="12">02 · VALIDATION</text><text x="330" y="280" fill="#183f37" font-size="19" font-weight="bold">Check the record</text><text x="330" y="306" fill="#67786d" font-size="13">Bounds · units · missing values</text>
<rect x="550" y="219" width="195" height="120" rx="15" fill="#b7d8bc"/><text x="570" y="252" fill="#397762" font-size="12">03 · LOCAL WORKSPACE</text><text x="570" y="280" fill="#183f37" font-size="19" font-weight="bold">Preserve evidence</text><text x="570" y="306" fill="#466e5d" font-size="13">Raw values · origins · history</text>
<rect x="790" y="219" width="205" height="120" rx="15" fill="#fff" stroke="#d2dfd5"/><text x="810" y="252" fill="#397762" font-size="12">04 · EXPLAINABLE RULES</text><text x="810" y="280" fill="#183f37" font-size="19" font-weight="bold">Inspect the reason</text><text x="810" y="306" fill="#67786d" font-size="13">Priority ≠ documentation</text>
<rect x="1040" y="219" width="110" height="120" rx="15" fill="#fff" stroke="#d2dfd5"/><text x="1054" y="252" fill="#397762" font-size="12">05 · QUEUE</text><text x="1054" y="282" fill="#183f37" font-size="17" font-weight="bold">Review</text><text x="1054" y="307" fill="#67786d" font-size="12">Next action</text>
<rect x="520" y="409" width="254" height="98" rx="14" fill="#173f36"/><text x="542" y="442" fill="#a9d7bc" font-size="12">HUMAN DECISION</text><text x="542" y="472" fill="#fff" font-size="19" font-weight="bold">Action + alias + reason</text>
<rect x="58" y="552" width="335" height="70" rx="12" fill="#fff" stroke="#d2dfd5"/><text x="78" y="580" fill="#183f37" font-size="17" font-weight="bold">Service worker → offline app shell</text><text x="78" y="603" fill="#67786d" font-size="13">First successful load caches local assets</text>
<rect x="427" y="552" width="335" height="70" rx="12" fill="#fff" stroke="#d2dfd5"/><text x="447" y="580" fill="#183f37" font-size="17" font-weight="bold">JSON / CSV → portable records</text><text x="447" y="603" fill="#67786d" font-size="13">Origins · units · settings · review history</text>
<rect x="796" y="552" width="354" height="70" rx="12" fill="#fff" stroke="#d2dfd5"/><text x="816" y="580" fill="#183f37" font-size="17" font-weight="bold">Official sources → inspectable method</text><text x="816" y="603" fill="#67786d" font-size="13">OneAquaHealth · EPA · USGS references</text>
</g></svg>
